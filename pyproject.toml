[project]
name = "systemone-qwen"
version = "0.1.0"
description = "System One decisions (OpenRouter/TypeSafe wire format) from Qwen answer-token logprobs served by llama-server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.scripts]
systemone-qwen = "systemone_qwen.app:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemone_qwen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
