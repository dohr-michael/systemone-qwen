name: Test, build and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: bash -n scripts/*.sh benchmark/*.sh
  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: systemone-qwen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test without a model server
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8000:8000 -e SYSTEMONE_BACKEND_URL=http://127.0.0.1:9 systemone-qwen:ci
          for _ in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/v1/models | grep -q qwen-decision
          # Unreachable backend must surface as 502, never as a fabricated answer.
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/systemone -H 'Content-Type: application/json' \
            -d '{"state":"s","questions":{"q":{"type":"noul","instructions":"?"}}}')
          test "$code" = 502
          docker rm -f smoke
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - name: Publish multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
